[project]
name = "montaigne-workspace" # Renamed root project
version = "0.1.0"
description = "Workspace for Montaigne TTS and related tools."
authors = [{ name = "Matheus Hoffmann", email = "hoffmann@poli.ufrj.br" }]
requires-python = ">=3.11,<3.12"
dependencies = [] # Root project has no direct dependencies now

[project.optional-dependencies]
dev = [
    "ruff==0.11.7",
    "pytest==8.3.5",
    "build==1.2.2.post1",
]

# No scripts defined at the root level anymore
# [project.scripts]

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Ruff config can remain at the root for workspace-wide checks
[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "C4", "UP", "ARG", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

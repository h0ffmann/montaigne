name: Python CI

on:
  push:
    branches:
      - master
      - feat/voice-profiles
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with tmate debugging enabled (bool)'
        required: false
        default: true
        type: boolean

# Add this concurrency configuration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-check:
    name: Code Quality Asserts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Set up pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
          
      - name: Set up pip cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"
          enable-cache: true

      - name: Verify uv.lock consistency
        run: |
          echo "Generating new lock file to compare..."
          # Make a backup of the original lock file
          cp uv.lock uv.lock.backup
          
          # Generate a new lock file (overwrites uv.lock)
          uv lock --python python3
          
          # Compare the new lock file with the backup
          echo "Comparing existing uv.lock with the generated lock file..."
          if diff -q uv.lock.backup uv.lock; then
            echo "✅ uv.lock is consistent and up-to-date."
          else
            echo "❌ uv.lock is out-of-date or inconsistent!"
            echo "Differences (existing vs generated):"
            diff -u uv.lock.backup uv.lock || true # Show diff
            echo ""
            echo "👉 Please run 'uv lock --python python3' locally and commit the updated uv.lock file."
            # Restore the original lock file
            mv uv.lock.backup uv.lock
            exit 1
          fi
          
          # Clean up the backup file
          rm -f uv.lock.backup

      - name: Install linting dependencies
        run: |
          # Install using pip instead of uv to avoid dynamic linking issues
          python -m pip install ruff==0.11.7
      
      - name: Run Ruff linter
        run: |
          echo "Running Ruff linter checks..."
          python -m ruff check --force-exclude --config=ruff.toml packages/
      
      - name: Run Ruff formatter check
        run: |
          echo "Running Ruff formatter checks..."
          python -m ruff format --force-exclude --config=ruff.toml --check packages/
      
      - name: Lint Dockerfile
        run: |
          echo "Installing Hadolint..."
          curl -sL -o /tmp/hadolint "https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64"
          chmod +x /tmp/hadolint
          echo "Running Hadolint on Dockerfile..."
          /tmp/hadolint Dockerfile

  run-tts-on-ubuntu:
    name: TTS Batch Regression Asserts
    needs: lint-and-check
    runs-on: ubuntu-latest
    env:
      # Ensure CPU-only mode for PyTorch/TTS
      CUDA_VISIBLE_DEVICES: ""
      USE_CUDA: "0"
      FORCE_CPU: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          # Remove the pip cache option as it's causing errors
          # cache: 'pip'

      - name: Set up TTS Models Cache 
        uses: actions/cache@v4
        id: tts-models-cache # Give an ID
        with:
          # Paths where models are typically downloaded
          path: |
            ~/.local/share/tts
            ~/.cache/suno
            ~/.cache/torch
            ~/.cache/huggingface/hub 
          # Key based on OS and dependency files (adjust if needed)
          key: ubuntu-tts-models-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ubuntu-tts-models-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Install system-level dependencies (no CUDA libraries)
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsndfile1 \
            libportaudio2 \
            libasound2-dev \
            libgl1 \
            build-essential \
            pkg-config
      
      - name: Install UV
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.17"  # Match the version used in Dockerfile
          enable-cache: true # Enable caching for faster runs
      
      - name: Install Just
        uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run TTS Tasks via Just (CPU-only)
        run: just run_tts_tasks_ubuntu_cpu
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-outputs
          path: |
            output/*.wav
          retention-days: 7
          
      - name: Setup tmate session for debugging
        if: failure() && inputs.debug_enabled == 'true'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
      
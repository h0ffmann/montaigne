name: Docker Build and Push

on:
  push:
    branches:
      - master # Trigger on merge/push to master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Just
        uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Optional: for downloading private assets if needed

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Use the default GITHUB_TOKEN

      - name: Build Docker image using Just
        run: just docker_build # This will now also tag for GHCR

      - name: Push Docker image using Just
        run: just docker_push # This will push the tags created by docker_build
````

**2. Modify `justfile` to add `docker_push` and update `docker_build`:**

We need to update `docker_build` to tag the image with the GHCR path and add a new `docker_push` recipe.


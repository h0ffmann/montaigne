name: Docker CI

on:
  push:
    branches:
      - master # Trigger build/push on merge/push to master
  schedule:
    - cron: '0 0 * * 0' # Run cleanup every Sunday at 00:00 UTC
  workflow_dispatch:
    inputs: # <-- Define inputs for manual trigger
      manual_tag:
        description: 'Optional: Manual tag (e.g., v1.0.0) for release. If set, this tag will be pushed.'
        required: false
        default: '' # Default to empty string if not provided
        type: string

permissions:
  contents: read
  packages: write # Needed for push and delete

env: # Define environment variables accessible by all jobs/steps
  # Sets the GHCR package name based on the repository name
  # Ensures consistency between jobs and with the cleanup action
  GHCR_PACKAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build & Push
    # Only run this job on push or workflow_dispatch events
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Permissions are now inherited from the workflow level

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Just
        uses: extractions/setup-just@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Optional: for downloading private assets if needed

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use github.repository_owner for robustness, or github.actor if preferred
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker files # Added step
        run: just prepare_docker_files
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pass the manual tag input to just, default to empty if not a dispatch event
          MANUAL_TAG: ${{ github.event.inputs.manual_tag || '' }}

      - name: Build Docker image using Just
        # Pass GITHUB_REPOSITORY to just so it knows how to tag for GHCR
        run: just docker_build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pass the manual tag input to just, default to empty if not a dispatch event
          MANUAL_TAG: ${{ github.event.inputs.manual_tag || '' }}

      - name: Push Docker image using Just
        run: just docker_push
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Pass the manual tag input to just again for pushing
          MANUAL_TAG: ${{ github.event.inputs.manual_tag || '' }}

  cleanup-ghcr:
    name: Clean
    # Only run this job on scheduled events
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # Permissions are inherited from the workflow level

    steps:
      - name: Delete old container versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.GHCR_PACKAGE_NAME }} # Use the env var defined above
          package-type: 'container'
          min-versions-to-keep: 5 # Keep at least 5 most recent versions
          delete-older-versions-than-days: 15 # Delete versions older than 15 days
          ignore-versions: '^(latest)$' # Regex to ignore the 'latest' tag
          token: ${{ secrets.GITHUB_TOKEN }}

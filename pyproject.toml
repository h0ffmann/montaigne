[project]
name = "montaigne"
version = "0.1.0"
description = "CLI tool for TTS (XTTS) with text preprocessing (pauses, emphasis, tone tags) and evaluation (Whisper)."
authors = [{ name = "Matheus Hoffmann", email = "hoffmann@poli.ufrj.br" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "click==8.1.8",
    "requests>=2.31.0",
    # --- Core Components (may include transitive deps like transformers) ---
    "TTS==0.22.0",
    "suno-bark @ git+https://github.com/suno-ai/bark.git", # Correct package name
    "openai-whisper==20240930",
    # --- Utilities ---
    "rapidfuzz==3.13.0",
    "pydub>=0.25.0",
    "yt-dlp>=2023.0.0", # For downloading YouTube audio
    "soundfile>=0.12.1", # Needed for saving Bark output
    # --- Potentially required by Bark/Whisper/TTS, ensure presence ---
    # Nix should ideally provide torch, torchaudio, numpy, pandas, scipy
    # Ensure HF libraries are present if not pulled by TTS/Bark
    "transformers>=4.0.0",
    "accelerate>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.7",
    "pytest==8.3.5",
    "build==1.2.2.post1",
]

[project.scripts]
montaigne = "montaigne.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff] # Configuração Ruff básica
line-length = 88
select = ["E", "F", "W", "I", "N", "C4", "UP", "ARG", "B"] # Seleção razoável de regras
ignore = ["B008"] # Exemplo: ignora B008 (Function call XYZ...) se for comum com Typer

[tool.ruff.format]
quote-style = "double"

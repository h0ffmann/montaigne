[project]
name = "montaigne"
version = "0.1.0"
description = "CLI tool for TTS (XTTS) with text preprocessing (pauses, emphasis, tone tags) and evaluation (Whisper)."
authors = [{ name = "Matheus Hoffmann", email = "hoffmann@poli.ufrj.br" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "click==8.1.8",
    "requests>=2.31.0",
    "TTS==0.22.0",
    "suno-bark @ git+https://github.com/suno-ai/bark.git",
    "openai-whisper==20240930",
    "rapidfuzz==3.13.0",
    "pydub>=0.25.0",
    "yt-dlp>=2023.0.0",
    "soundfile>=0.12.1",
    "matplotlib>=3.5.0",
    "sounddevice>=0.4.5",
    "numpy>=1.20.0",
    "piper-tts>=1.2.0",
    "transformers>=4.0.0",
    "accelerate>=0.20.0",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.11.7",
    "pytest==8.3.5",
    "build==1.2.2.post1",
]

[project.scripts]
montaigne = "montaigne.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff.format]
quote-style = "double"

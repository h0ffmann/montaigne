# Montaigne Voice Profiles Configuration
# This file contains voice profiles for the Montaigne TTS system
# Each profile includes metadata and a list of source URLs (typically YouTube)

[config]
# Default settings for all profiles
download_dir = "voices"
cache_dir = "${HOME}/.cache/montaigne/voices"
preprocessed_dir = "${HOME}/.cache/montaigne/preprocessed"
# Minimum Signal-to-Noise Ratio for acceptable voice sample
min_snr = 15.0
# Maximum number of parallel downloads
max_concurrent_downloads = 4
# Whether to force redownload if file exists
force_redownload = false
# Default voice mode (simple or deep)
default_mode = "simple"
# Minimum voice length in seconds
min_voice_length = 6.0
# Recommended voice length in seconds (for deep mode)
recommended_voice_length = 10.0
# Maximum number of videos to use per profile
max_videos_per_profile = 5

# XTTS Engine parameters
[engines.xtts]
# Number of samples for the autoregressive model (higher = better quality, more time)
num_gpt_outputs = 16
# Seconds of audio to be used as conditioning (more = better quality)
gpt_cond_len = 6
# Audio chunk size in seconds (smaller = more stability)
gpt_cond_chunk_len = 3
# Maximum reference length in seconds
max_ref_len = 10
# Whether to normalize reference audio
sound_norm_refs = true

# Simple mode parameters (faster, less resource intensive)
[modes.simple]
num_gpt_outputs = 8
gpt_cond_len = 4
gpt_cond_chunk_len = 2

# Deep mode parameters (better quality, more resource intensive)
[modes.deep]
num_gpt_outputs = 16
gpt_cond_len = 12
gpt_cond_chunk_len = 4

# Profile definitions
[profiles.bolsonaro]
name = "Jair Bolsonaro"
language = "pt"

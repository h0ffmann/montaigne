[project]
name = "montaigne-workspace"
version = "0.1.0"
description = "Workspace for Montaigne TTS and related tools."
authors = [{ name = "Matheus Hoffmann", email = "hoffmann@poli.ufrj.br" }]
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff==0.11.7",
    "pytest==8.3.5",
    "build==1.2.2.post1",
]

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "N", "C4", "UP", "ARG", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["*"]  # package names should match these glob patterns (["*"] by default)
exclude = ['next', 'input', 'output', 'packages', 'model_files', 'analysis_plots'] 
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)